apiVersion: v1
kind: Namespace
metadata:
  name: fashion-merchandising
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fashion-triton
  namespace: fashion-merchandising
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fashion-triton
  template:
    metadata:
      labels:
        app: fashion-triton
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: triton
          image: fashion-triton:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
            - name: grpc
              containerPort: 8001
              protocol: TCP
            - name: metrics
              containerPort: 8002
              protocol: TCP
          startupProbe:
            httpGet:
              path: /v2/health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /v2/health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /v2/health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 4Gi
---
apiVersion: v1
kind: Service
metadata:
  name: fashion-triton
  namespace: fashion-merchandising
spec:
  type: ClusterIP
  selector:
    app: fashion-triton
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
    - name: grpc
      port: 8001
      targetPort: grpc
      protocol: TCP
    - name: metrics
      port: 8002
      targetPort: metrics
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fashion-api
  namespace: fashion-merchandising
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fashion-api
  template:
    metadata:
      labels:
        app: fashion-api
    spec:
      containers:
        - name: api
          image: fashion-api:0.1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: TRITON_URL
              value: http://fashion-triton:8000
            - name: MODEL_METADATA_PATH
              value: /app/fashion_model.metadata.json
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: fashion-api
  namespace: fashion-merchandising
spec:
  type: ClusterIP
  selector:
    app: fashion-api
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
