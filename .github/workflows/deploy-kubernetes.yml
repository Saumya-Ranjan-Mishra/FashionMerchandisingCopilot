name: Publish and deploy fashion inference

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: fashion-merchandising-deploy
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish images
    runs-on: ubuntu-latest
    outputs:
      triton_image: ${{ steps.images.outputs.triton }}
      api_image: ${{ steps.images.outputs.api }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Resolve GHCR image names
        id: images
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          echo "triton=ghcr.io/${repository}-triton" >> "$GITHUB_OUTPUT"
          echo "api=ghcr.io/${repository}-api" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Triton image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/triton/Dockerfile
          push: true
          tags: |
            ${{ steps.images.outputs.triton }}:${{ github.sha }}
            ${{ steps.images.outputs.triton }}:${{ github.ref_name }}

      - name: Build and push image upload API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/api/Dockerfile
          push: true
          tags: |
            ${{ steps.images.outputs.api }}:${{ github.sha }}
            ${{ steps.images.outputs.api }}:${{ github.ref_name }}

